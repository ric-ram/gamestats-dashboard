name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            DB_USER: ${{ secrets.DB_USER }}
            DB_PASS: ${{ secrets.DB_PASS }}
            DB_ROOT_PASS: ${{ secrets.DB_ROOT_PASS }}
            DB_NAME: ${{ secrets.DB_NAME }}
        strategy:
            matrix:
                node-version: ['22.7.0']
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint all workspaces
              run: npm run lint

            - name: Start Kafka & MariaDB services
              run: docker compose up --wait -d kafka mariadb

            - name: Wait for MariaDB to be ready
              run: |
                  docker-compose exec mariadb bash -c "healthcheck.sh --su-mysql --connect --innodb_initialized"

            - name: Wait for Kafka to be ready
              run: |
                  docker-compose exec kafka bash -c "cub kafka-ready -b kafka:9092 1 20"

            - name: Run DB migrations
              run: npm --workspace=apps/backend run typeorm migration:run

            - name: Run backend integration tests
              run: npm --workspace=apps/backend run test:e2e

            - name: Build backend
              run: npm run build:backend

            - name: Build frontend
              run: npm run build:frontend

            - name: Run backend unit tests
              run: npm --workspace=apps/backend run test

            # - name: Run frontend tests
            #   run: npm --workspace=apps/frontend run test

            - name: Tear down services
              if: always()
              run: docker compose down --remove-orphans --volumes
